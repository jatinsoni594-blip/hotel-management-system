        setToast(msg);
        setTimeout(() => setToast(''), 3000);
      };

      const updateRoomStatus = (roomNumber, newStatus) => {
        setRooms(prev => prev.map(r => r.roomNumber === roomNumber ? { ...r, status: newStatus } : r));
        showToast(`Room #${roomNumber} updated to ${newStatus}`);
      };

      const updateBookingStatus = (bookingId, newStatus) => {
        let roomNum = null;
        setBookings(prev => prev.map(b => {
          if (b.bookingId === bookingId) {
            roomNum = b.roomNumber;
            return { ...b, bookingStatus: newStatus };
          }
          return b;
        }));

        if (roomNum) {
          if (newStatus === 'Checked-In') updateRoomStatus(roomNum, 'Occupied');
          if (newStatus === 'Checked-Out') updateRoomStatus(roomNum, 'Cleaning');
          if (newStatus === 'Cancelled') updateRoomStatus(roomNum, 'Available');
        }
        showToast(`Booking ${bookingId} marked as ${newStatus}`);
      };

        setRooms(prev => [newRoom, ...prev]);
        showToast(`Room #${newRoom.roomNumber} added successfully!`);

            <div className="flex justify-between items-center pb-6 border-b border-slate-800">
              <div>
                <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Hotel Operations Hub
                </span>
                <h1 className="font-serif-luxury text-3xl font-bold mt-1">Property Management Dashboard</h1>
              </div>
              <button 
                onClick={() => setIsAddOpen(true)}
                className="px-4 py-2.5 rounded-xl text-xs font-bold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg shadow-amber-500/20"
              >
                ➕ Add Room
              </button>
            </div>

            {/* KPIs */}
            <div className="grid grid-cols-2 sm:grid-cols-5 gap-4">
              <div className="p-5 rounded-2xl bg-slate-800/80 border border-slate-700">
                <span className="text-xs text-slate-400 uppercase font-bold">Total Rooms</span>
                <div className="text-2xl font-bold mt-1">{totalRooms}</div>
              </div>
              <div className="p-5 rounded-2xl bg-slate-800/80 border border-slate-700">
                <span className="text-xs text-slate-400 uppercase font-bold">Occupancy Rate</span>
                <div className="text-2xl font-bold text-amber-400 mt-1">{occupancy}%</div>
              </div>
              <div className="p-5 rounded-2xl bg-slate-800/80 border border-slate-700">
                <span className="text-xs text-slate-400 uppercase font-bold">Available Keys</span>
                <div className="text-2xl font-bold text-emerald-400 mt-1">{available}</div>
              </div>
              <div className="p-5 rounded-2xl bg-slate-800/80 border border-slate-700">
                <span className="text-xs text-slate-400 uppercase font-bold">Cleaning Queue</span>
                <div className="text-2xl font-bold text-amber-300 mt-1">{cleaning}</div>
              </div>
              <div className="p-5 rounded-2xl bg-slate-800/80 border border-slate-700 col-span-2 sm:col-span-1">
                <span className="text-xs text-slate-400 uppercase font-bold">Total Revenue</span>
                <div className="text-2xl font-bold text-blue-400 mt-1">₹{revenue.toLocaleString('en-IN')}</div>
              </div>
            </div>

            {/* Sub-tabs */}
            <div className="flex gap-2 border-b border-slate-800 pb-px">
              {[
                { id: 'matrix', label: '🎛️ Live Room Matrix' },
                { id: 'bookings', label: `📅 Bookings (${bookings.length})` },
                { id: 'housekeeping', label: `🧹 Housekeeping (${cleaning})` },
                { id: 'guests', label: '👥 Guest Profiles' }
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-4 py-2.5 rounded-t-xl text-xs font-bold transition border-b-2 ${tab === t.id ? 'border-amber-400 text-amber-400 bg-slate-800/60' : 'border-transparent text-slate-400 hover:text-white'}`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* TAB: MATRIX */}
            {tab === 'matrix' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                {rooms.map(r => (
                  <div key={r.roomNumber} className="p-5 rounded-2xl bg-slate-800/90 border border-slate-700 space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[10px] text-slate-400 font-mono">Floor {r.floor}</span>
                        <h4 className="font-serif-luxury text-xl font-bold">Room #{r.roomNumber}</h4>
                        <p className="text-xs text-slate-400 truncate">{r.type}</p>
                      </div>
                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${r.status === 'Available' ? 'bg-emerald-500/20 text-emerald-400' : r.status === 'Occupied' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-300'}`}>
                        {r.status}
                      </span>
                    </div>
                    <div className="text-xs text-slate-400">
                      <div>Rate: <span className="font-bold text-white">₹{r.pricePerNight.toLocaleString('en-IN')}</span>/night</div>
                      <div>Max: {r.capacity} Guests ({r.bedType})</div>
                    </div>
                    <div>
                      <label className="block text-[10px] text-slate-400 font-bold uppercase mb-1">Status:</label>
                      <select
                        value={r.status}
                        onChange={e => onUpdateRoomStatus(r.roomNumber, e.target.value)}
                        className="w-full text-xs bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white"
                      >
                        <option value="Available">Available</option>
                        <option value="Occupied">Occupied</option>
                        <option value="Cleaning">Cleaning</option>
                        <option value="Maintenance">Maintenance</option>
                      </select>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: BOOKINGS */}
            {tab === 'bookings' && (
              <div className="bg-slate-800/70 rounded-2xl border border-slate-800 overflow-hidden">
                <div className="p-4 border-b border-slate-800 flex gap-2 overflow-x-auto">
                  {['All', 'Confirmed', 'Checked-In', 'Checked-Out', 'Cancelled'].map(st => (
                    <button key={st} onClick={() => setFilter(st)} className={`px-3 py-1 rounded-lg text-xs font-bold ${filter === st ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                      {st}
                    </button>
                  ))}
                </div>
                <table className="w-full text-left text-xs text-slate-300">
                  <thead className="bg-slate-900/80 uppercase text-slate-400 border-b border-slate-800">
                    <tr>
                      <th className="py-3 px-4">Booking ID</th>
                      <th className="py-3 px-4">Guest</th>
                      <th className="py-3 px-4">Room</th>
                      <th className="py-3 px-4">Dates</th>
                      <th className="py-3 px-4">Total</th>
                      <th className="py-3 px-4">Status</th>
                      <th className="py-3 px-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {filteredBookings.map(b => (
                      <tr key={b.bookingId} className="hover:bg-slate-800/40">
                        <td className="py-3 px-4 font-mono font-bold text-amber-400">{b.bookingId}</td>
                        <td className="py-3 px-4">
                          <div className="font-bold text-white">{b.guest.name}</div>
                          <div className="text-[11px] text-slate-400">{b.guest.email} · {b.guest.phone}</div>
                        </td>
                        <td className="py-3 px-4 font-bold">#{b.roomNumber} ({b.roomType})</td>
                        <td className="py-3 px-4">{b.checkInDate} → {b.checkOutDate}</td>
                        <td className="py-3 px-4 font-bold text-white">₹{b.totalPrice.toLocaleString('en-IN')}</td>
                        <td className="py-3 px-4">
                          <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${b.bookingStatus === 'Confirmed' ? 'bg-blue-500/20 text-blue-400' : b.bookingStatus === 'Checked-In' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700 text-slate-300'}`}>
                            {b.bookingStatus}
                          </span>
                        </td>
                        <td className="py-3 px-4 text-right space-x-1">
                          {b.bookingStatus === 'Confirmed' && (
                            <button onClick={() => onUpdateBookingStatus(b.bookingId, 'Checked-In')} className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[11px] font-bold">Check In</button>
                          )}
                          {b.bookingStatus === 'Checked-In' && (
                            <button onClick={() => onUpdateBookingStatus(b.bookingId, 'Checked-Out')} className="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded text-[11px] font-bold">Check Out</button>
                          )}
                          {b.bookingStatus !== 'Cancelled' && b.bookingStatus !== 'Checked-Out' && (
                            <button onClick={() => onUpdateBookingStatus(b.bookingId, 'Cancelled')} className="px-2 py-1 bg-slate-800 text-slate-400 hover:text-rose-400 rounded text-[11px]">Cancel</button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* TAB: HOUSEKEEPING */}
            {tab === 'housekeeping' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {rooms.filter(r => r.status === 'Cleaning' || r.status === 'Maintenance').map(r => (
                  <div key={r.roomNumber} className="p-5 rounded-2xl bg-slate-800/90 border border-amber-500/40 flex justify-between items-center">
                    <div>
                      <span className="text-xs text-amber-400 font-mono">Floor {r.floor}</span>
                      <h4 className="font-serif-luxury text-lg font-bold">Room #{r.roomNumber} - {r.type}</h4>
                      <p className="text-xs text-slate-400 mt-1">Status: <span className="font-bold text-amber-300">{r.status}</span></p>
                    </div>
                    <button
                      onClick={() => onUpdateRoomStatus(r.roomNumber, 'Available')}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow"
                    >
                      ✓ Mark Cleaned
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: GUESTS */}
            {tab === 'guests' && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {guests.map(g => (
                  <div key={g.id} className="p-5 rounded-2xl bg-slate-800/90 border border-slate-700 space-y-2">
                    <div className="flex justify-between items-start">
                      <div>
                        <h4 className="font-bold text-white text-base">{g.name}</h4>
                        <p className="text-xs text-slate-400">{g.email} · {g.phone}</p>
                      </div>
                      <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/20 text-amber-300">{g.membership}</span>
                    </div>
                    <div className="flex gap-4 text-xs text-slate-300 py-1 border-t border-slate-700">
                      <div>Stays: <span className="font-bold text-white">{g.totalStays}</span></div>
                      <div>Total Spent: <span className="font-bold text-emerald-400">₹{g.totalSpent.toLocaleString('en-IN')}</span></div>
                    </div>
                    {g.notes && <p className="text-xs text-slate-400 italic">"{g.notes}"</p>}
                  </div>
                ))}
              </div>
            )}

          </div>

          {/* Add Room Modal */}
          {isAddOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-3xl max-w-md w-full p-6 text-white relative">
                <button onClick={() => setIsAddOpen(false)} className="absolute top-6 right-6 text-slate-400 font-bold">✕</button>
                <h3 className="font-serif-luxury text-xl font-bold mb-4">Add New Room</h3>
                <form onSubmit={handleAddSubmit} className="space-y-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Room Number</label>
                    <input required type="text" placeholder="e.g. 501" value={newRoom.roomNumber} onChange={e => setNewRoom({...newRoom, roomNumber: e.target.value})} className="w-full bg-slate-800 p-2 rounded-xl border border-slate-700 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">Suite Name</label>
                    <input required type="text" placeholder="e.g. Royal Skyline Suite" value={newRoom.type} onChange={e => setNewRoom({...newRoom, type: e.target.value})} className="w-full bg-slate-800 p-2 rounded-xl border border-slate-700 text-xs text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Price/Night (₹)</label>
                      <input required type="number" value={newRoom.pricePerNight} onChange={e => setNewRoom({...newRoom, pricePerNight: e.target.value})} className="w-full bg-slate-800 p-2 rounded-xl border border-slate-700 text-xs text-white" />
                    </div>
                    <div>
                      <label className="block text-xs text-slate-400 mb-1">Floor</label>
                      <input type="number" value={newRoom.floor} onChange={e => setNewRoom({...newRoom, floor: e.target.value})} className="w-full bg-slate-800 p-2 rounded-xl border border-slate-700 text-xs text-white" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-3">
                    <button type="button" onClick={() => setIsAddOpen(false)} className="px-3 py-2 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-amber-500 text-slate-950 font-bold text-xs rounded-xl">Save Room</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // BOOKING FORM DIALOG
    function BookingDialog({ room, onClose, onSuccess }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [phone, setPhone] = useState('');
      const [checkIn, setCheckIn] = useState(new Date().toISOString().split('T')[0]);
      const [checkOut, setCheckOut] = useState(new Date(Date.now() + 2 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]);
      const [guests, setGuests] = useState(2);
      const [payment, setPayment] = useState('UPI');
      const [confirmed, setConfirmed] = useState(null);

      const days = Math.max(1, Math.ceil((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24)));
      const subtotal = days * room.pricePerNight;
      const gst = Math.round(subtotal * 0.12);
      const total = subtotal + gst;

      const handleConfirm = (e) => {
        e.preventDefault();
        const b = {
          bookingId: `BK-2026-${Math.floor(1000 + Math.random() * 9000)}`,
          guest: { name, email, phone },
          roomNumber: room.roomNumber,
          roomType: room.type,
          checkInDate: checkIn,
          checkOutDate: checkOut,
          numberOfGuests: Number(guests),
          totalPrice: total,
          paymentStatus: payment === 'Pay at Hotel' ? 'Pending' : 'Paid',
          paymentMethod: payment,
          bookingStatus: 'Confirmed'
        };
        setConfirmed(b);
        onSuccess(b);
      };

      if (confirmed) {
        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
            <div className="bg-white rounded-3xl max-w-md w-full p-8 text-center text-slate-900 shadow-2xl relative">
              <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-bold">✓</div>
              <h3 className="font-serif-luxury text-2xl font-bold">Reservation Confirmed!</h3>
              <p className="text-xs text-slate-500 mt-1">Thank you, {confirmed.guest.name}!</p>
              
              <div className="my-5 p-4 rounded-2xl bg-slate-50 border border-slate-200 text-left text-xs space-y-1.5">
                <div className="flex justify-between pb-1 border-b">
                  <span className="font-bold text-slate-500">Booking Reference</span>
                  <span className="font-mono font-bold text-blue-600">{confirmed.bookingId}</span>
                </div>
                <div className="flex justify-between"><span>Room:</span><span className="font-bold">#{confirmed.roomNumber} ({confirmed.roomType})</span></div>
                <div className="flex justify-between"><span>Dates:</span><span>{confirmed.checkInDate} to {confirmed.checkOutDate}</span></div>
                <div className="flex justify-between"><span>Total:</span><span className="font-bold text-slate-900">₹{confirmed.totalPrice.toLocaleString('en-IN')} ({confirmed.paymentMethod})</span></div>
              </div>

              <div className="flex gap-2">
                <button onClick={() => window.print()} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">🖨️ Print Voucher</button>
                <button onClick={onClose} className="flex-1 py-2.5 bg-blue-600 text-white text-xs font-bold rounded-xl">Done</button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 text-slate-900 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 font-bold">✕</button>
            <span className="text-xs font-bold uppercase tracking-widest text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full">{room.category}</span>
            <h2 className="font-serif-luxury text-2xl font-bold mt-2">Book Room #{room.roomNumber}</h2>
            <p className="text-xs text-slate-500">₹{room.pricePerNight.toLocaleString('en-IN')} per night · {room.capacity} Guests Max</p>

            <form onSubmit={handleConfirm} className="space-y-4 mt-6">
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
                  <input required type="text" placeholder="e.g. Rahul Sharma" value={name} onChange={e => setName(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Email *</label>
                  <input required type="email" placeholder="rahul@example.com" value={email} onChange={e => setEmail(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Phone Number (WhatsApp) *</label>
                  <input required type="tel" placeholder="+91 98765 43210" value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Payment Method</label>
                  <select value={payment} onChange={e => setPayment(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs">
                    <option value="UPI">UPI (Google Pay / PhonePe / Paytm)</option>
                    <option value="Credit / Debit Card">Credit / Debit Card</option>
                    <option value="Net Banking">Net Banking</option>
                    <option value="Pay at Hotel">Pay at Check-In (Cash/UPI)</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Check-In</label>
                  <input required type="date" value={checkIn} onChange={e => setCheckIn(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Check-Out</label>
                  <input required type="date" value={checkOut} onChange={e => setCheckOut(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs" />
                </div>
              </div>

              <div className="p-4 bg-slate-50 border rounded-2xl text-xs space-y-1">
                <div className="flex justify-between"><span>{days} nights × ₹{room.pricePerNight.toLocaleString('en-IN')}</span><span className="font-bold">₹{subtotal.toLocaleString('en-IN')}</span></div>
                <div className="flex justify-between"><span>GST & Service (12%)</span><span>₹{gst.toLocaleString('en-IN')}</span></div>
                <div className="flex justify-between font-bold text-sm pt-1 border-t text-slate-900"><span>Total Payable</span><span className="text-blue-600">₹{total.toLocaleString('en-IN')}</span></div>
              </div>

              <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-lg shadow-blue-500/25">
                Confirm & Pay ₹{total.toLocaleString('en-IN')}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // LOOKUP DIALOG
    function LookupDialog({ bookings, onClose }) {
      const [id, setId] = useState('');
      const [res, setRes] = useState(null);
      const [err, setErr] = useState('');

      const handleSearch = (e) => {
        e.preventDefault();
        setErr('');
        const found = bookings.find(b => b.bookingId.toUpperCase() === id.trim().toUpperCase() || b.guest.email.toLowerCase() === id.trim().toLowerCase());
        if (found) setRes(found);
        else { setRes(null); setErr('No reservation found with that ID or email.'); }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fadeIn">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 text-slate-900 shadow-2xl relative">
            <button onClick={onClose} className="absolute top-6 right-6 text-slate-400 font-bold">✕</button>
            <h3 className="font-serif-luxury text-xl font-bold mb-1">Find Your Reservation</h3>
            <p className="text-xs text-slate-500 mb-4">Enter your Booking ID (e.g. BK-2026-8801) or email.</p>
            
            <form onSubmit={handleSearch} className="flex gap-2 mb-4">
              <input type="text" placeholder="BK-2026-8801 or email..." value={id} onChange={e => setId(e.target.value)} className="flex-1 px-3 py-2 border rounded-xl text-xs" />
              <button type="submit" className="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Search</button>
            </form>

            {err && <div className="p-3 bg-rose-50 text-rose-700 text-xs rounded-xl">{err}</div>}

            {res && (
              <div className="p-4 bg-slate-50 border rounded-2xl text-xs space-y-1.5 animate-fadeIn">
                <div className="flex justify-between font-bold border-b pb-1">
                  <span>{res.bookingId}</span>
                  <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">{res.bookingStatus}</span>
                </div>
                <div>Guest: <span className="font-bold">{res.guest.name}</span></div>
                <div>Room: <span className="font-bold">#{res.roomNumber} ({res.roomType})</span></div>
                <div>Dates: {res.checkInDate} to {res.checkOutDate}</div>
                <div>Amount: <span className="font-bold">₹{res.totalPrice.toLocaleString('en-IN')}</span> ({res.paymentStatus})</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
